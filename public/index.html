<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messages — SMS test</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="app">
    <aside class="convList">
      <div class="convListHeader">
        <span class="convListTitle">SMS Bot</span>
        <div class="convListSubtitle">Simple real-time chat for Vonage SMS</div>
      </div>
      <div class="convListBody">
        <div class="smsConfigSection">
          <p class="configHint">Set numbers once, then click Start.</p>
          <div class="fieldGroup">
            <label for="botNumber">Bot Number:</label>
            <input type="tel" id="botNumber" placeholder="e.g. 18335094805" />
          </div>
          <div class="fieldGroup">
            <label for="customerNumber">Vonage Number:</label>
            <input type="tel" id="customerNumber" placeholder="e.g. 18334299343" />
          </div>
          <button id="startBtn" class="startBtn" type="button">Start</button>
        </div>
      </div>
    </aside>

    <main class="threadPane">
      <header class="chatHeader">
        <div>
          <div class="threadTitle" id="threadTitle">Messages</div>
          <div class="threadSub" id="threadSub">Loading…</div>
        </div>
        <div class="badge">
          <span id="dot" class="dot idle"></span>
          <span id="liveTxt">Offline</span>
        </div>
      </header>

      <div
        id="chat"
        class="chat"
        role="log"
        aria-live="polite"
      ></div>

      <div class="composer">
        <input
          id="msg"
          type="text"
          placeholder="Type a message"
          autocomplete="off"
          disabled
        />
        <button id="sendBtn" class="sendBtn" type="button" disabled>
          Send
        </button>
      </div>

      <div id="status" class="statusLine">Loading…</div>
    </main>
  </div>

  <script src="./app.js"></script>
</body>

</html>
